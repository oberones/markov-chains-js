worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 1m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Only Vite's fingerprinted assets are immutable, and never cache errors.
    map "$status:$uri" $cache_control {
        default "no-cache";
        ~^(200|206|304):/assets/ "public, max-age=31536000, immutable";
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;
        root /srv/markov-playground-js;
        index index.html;
        autoindex off;
        absolute_redirect off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control $cache_control always;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/css text/plain application/javascript text/javascript application/json image/svg+xml;

        location ~ /\. {
            return 404;
        }
        location / {
            # This app has no client-side routes. Missing assets must stay 404s.
            try_files $uri $uri/ =404;
            limit_except GET HEAD {
                deny all;
            }
        }
    }
}
